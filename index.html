    /* Old-school analog tape & xerox flyer grain */
    .thrash-grain {
      background-image: radial-gradient(#ece0b8 0.75px, transparent 0.75px), radial-gradient(#3a1514 0.75px, #120606 0.75px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      opacity: 0.04;
    }

    /* Authentic underground card styling: solid, heavy, dark */
    .thrash-btn {
      background-color: #200c0b;
      border: 1.5px solid #3a1514;
      transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .thrash-btn:hover {
      background-color: #2d1110;
      border-color: #ece0b8;
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
    }

    .thrash-btn:active {
      transform: translateY(0);
    }

    /* Booking Highlight Card (Exclusive) */
    .thrash-btn-booking {
      background: linear-gradient(180deg, #3a1514 0%, #250c0c 100%);

    // Non-intrusive banner notification
    function notify(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.remove('-translate-y-16', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-16', 'opacity-0');
      }, 2500);
    }

    // Safe clipboard copy
    function copyText(text, successMsg) {
      const el = document.createElement('textarea');
      el.value = text;
      el.setAttribute('readonly', '');
      el.style.position = 'absolute';
      el.style.left = '-9999px';
      document.body.appendChild(el);
      el.select();
      try {
        document.execCommand('copy');
        notify(successMsg);
      } catch (err) {
        notify("Could not copy text");
      }
      document.body.removeChild(el);
    }

      }
    }

    // Render links: Only booking gets highlighted, booking is forced first
    function renderLinkStack(links) {
      const container = document.getElementById('links-container');
      container.innerHTML = '';

      // Guarantee booking is at index 0
      const sortedLinks = [...links].sort((a, b) => (b.is_booking ? 1 : 0) - (a.is_booking ? 1 : 0));

      sortedLinks.forEach(link => {
        let imgSrc = link.image;
        if (link.id === 'vibe' && (!imgSrc || imgSrc.includes('.jp') || imgSrc.includes('.png'))) {
          imgSrc = "https://vi-be.imgix.net/artists/Gravitor/Gravitor.jpg";
        }

        const a = document.createElement('a');
        a.href = link.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.addEventListener('click', () => {
          if (typeof gtag === 'function') {
            gtag('event', 'select_content', {
              content_type: 'band_link',
              item_id: link.id,        // bijv: 'booking', 'spotify', 'instagram', 'vibe'
              link_title: link.title,  // bijv: 'Booking & Questions', 'Spotify'
              destination_url: link.url
            });
          }
        });
        
        // Only the booking card gets the bright highlight
        a.className = `${
          link.is_booking ? 'thrash-btn-booking' : 'thrash-btn'
        } w-full flex items-center justify-between p-3 sm:p-3.5 rounded-lg text-left shadow group`;

        // Left section: Image thumbnail + Titles
        const left = document.createElement('div');
        left.className = "flex items-center gap-3.5 min-w-0";

        // Thumbnail icon box
        const thumb = document.createElement('div');
        thumb.className = `w-11 h-11 rounded overflow-hidden flex-shrink-0 flex items-center justify-center border ${
          link.is_booking ? 'border-cream bg-oxblood' : 'border-oxblood-light bg-black'
        } `;

        if (imgSrc) {
          const img = document.createElement('img');
          img.src = imgSrc;
          img.alt = link.title;
          img.className = "w-full h-full object-cover";
          img.onerror = () => {
            img.remove();
            thumb.innerHTML = getCardIcon(link.fallback_icon);
          };
          thumb.appendChild(img);
        } else {
          thumb.innerHTML = getCardIcon(link.fallback_icon);
        }
        left.appendChild(thumb);

        // Titles
        const titles = document.createElement('div');
        titles.className = "flex flex-col min-w-0";

        const titleRow = document.createElement('div');
        titleRow.className = "flex items-center gap-2";

        const h2 = document.createElement('h2');
        h2.className = `text-sm sm:text-base font-bold truncate ${
          link.is_booking ? 'text-cream font-thrash tracking-wider text-base sm:text-lg' : 'text-cream'
        }`;
        h2.textContent = link.title;
        titleRow.appendChild(h2);

        if (link.is_booking) {
          const badge = document.createElement('span');
          badge.className = "text-[9px] font-bold uppercase px-1.5 py-0.5 rounded bg-cream text-oxblood font-body tracking-wider";
          badge.textContent = "DIRECT";
          titleRow.appendChild(badge);
        }

        const p = document.createElement('p');
        p.className = "text-xs text-cream/70 truncate font-medium";
        p.innerHTML = link.subtitle;

        titles.appendChild(titleRow);
        titles.appendChild(p);
        left.appendChild(titles);

        // Right chevron
        const right = document.createElement('div');
        right.className = "flex-shrink-0 text-cream/40 group-hover:text-cream pl-2 transition";
        right.innerHTML = `
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>
          </svg>
        `;

        a.appendChild(left);
        a.appendChild(right);
        container.appendChild(a);
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('year').textContent = new Date().getFullYear();

      // Load config from main.json or fallback
      let config = DEFAULT_CONFIG;
      try {
        const res = await fetch('./main.json');
        if (res.ok) {
          config = await res.json();
        }
      } catch (e) {
        // Use default fallback
      }

      // Render links
      renderLinkStack(config.links);

      // Share Modal logic
      const modalShare = document.getElementById('modal-share');

      document.getElementById('btn-share').addEventListener('click', async () => {
        if (navigator.share) {
          try {
            await navigator.share({
              title: 'GRAVITOR | Thrash Metal Belgium',
              text: 'Booking & official links for Gravitor (Belgian Thrash Metal):',
              url: window.location.href
            });
            return;
          } catch(e) {}
        }
        modalShare.classList.remove('hidden');
      });

      document.getElementById('btn-close-share').addEventListener('click', () => modalShare.classList.add('hidden'));

      // Share inside modal
      document.getElementById('btn-share-wa').addEventListener('click', () => {
        const text = encodeURIComponent(`Check out Gravitor (Thrash Metal Belgium): ${window.location.href}`);
        window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
        modalShare.classList.add('hidden');
      });

      document.getElementById('btn-share-copy').addEventListener('click', () => {
        copyText(window.location.href, "Page URL copied to clipboard");
        modalShare.classList.add('hidden');
      });

      // Backdrop close
      modalShare.addEventListener('click', (e) => {
        if (e.target === modalShare) modalShare.classList.add('hidden');
      });
    });
  </script>
</body>
</html>
